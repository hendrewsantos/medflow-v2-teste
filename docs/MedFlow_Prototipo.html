<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MedFlow Solutions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700&display=swap">
<style>/* MedFlow Solutions — folha de estilos única (usada pelo app Vue e pelo protótipo).
   Layout: barra lateral azul-marinho para a equipe e o paciente no desktop; no celular vira cabeçalho
   compacto com navegação horizontal. Cartão só onde existe um objeto separado (pedido, receita, lote). */

:root {
  /* Cor — neutros com leve viés azul-esverdeado, vindos da marca (azul-marinho + verde-água) */
  --bg: #f2f5f7;
  --surface: #ffffff;
  --surface-2: #e9eff2;
  --line: #d3dde2;
  --line-strong: #b6c4cc;
  --ink: #0e1f33;
  --ink-2: #455867;
  --ink-3: #66798a;
  --brand: #02756e;
  --brand-hover: #015d57;
  --brand-ink: #ffffff;
  --brand-soft: #dbf0ec;
  --pulse: #12a865;
  --side: #0b1f4b;
  --side-2: #142c63;
  --side-ink: #ffffff;
  --side-ink-2: #a9bbdd;
  --ok: #13703f;
  --ok-soft: #dcf2e4;
  --warn: #8a5300;
  --warn-soft: #fbefd8;
  --bad: #ad2318;
  --bad-soft: #fbe2df;
  --info: #1b5aa0;
  --info-soft: #e0ebf8;
  --tarja-vermelha: #c3241f;
  --tarja-preta: #161616;
  --overlay: rgba(9, 20, 33, 0.48);
  --shadow: 0 1px 2px rgba(14, 31, 51, 0.06), 0 6px 20px rgba(14, 31, 51, 0.07);
  --focus: #f0b400;
  --tag-bg: #12a865;
  --tag-ink: #04211e;

  /* Tipo — Lexend e Atkinson Hyperlegible foram desenhadas para legibilidade (requisito de acessibilidade) */
  --f-display: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-md: 0.9375rem;
  --t-lg: 1.125rem;
  --t-xl: 1.5rem;
  --t-2xl: 2rem;

  --r: 10px;
  --r-sm: 6px;
  --side-w: 248px;
  font-size: 100%;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c161f; --surface: #121f2a; --surface-2: #192a37; --line: #273b4a; --line-strong: #3a5263;
    --ink: #e5edf2; --ink-2: #a8b9c5; --ink-3: #8798a5;
    --brand: #3cc0b2; --brand-hover: #5fd2c6; --brand-ink: #04211e; --brand-soft: #12393a; --pulse: #3fd38c;
    --side: #08152f; --side-2: #10254d; --side-ink: #f1f5fb; --side-ink-2: #9db0d3;
    --ok: #5fd394; --ok-soft: #10301f; --warn: #f2b65a; --warn-soft: #36270d; --bad: #ff8f84; --bad-soft: #3c1714;
    --info: #86b9f2; --info-soft: #13273e; --tarja-vermelha: #ff7a73; --tarja-preta: #e5edf2;
    --overlay: rgba(0, 0, 0, 0.62); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c161f; --surface: #121f2a; --surface-2: #192a37; --line: #273b4a; --line-strong: #3a5263;
  --ink: #e5edf2; --ink-2: #a8b9c5; --ink-3: #8798a5;
  --brand: #3cc0b2; --brand-hover: #5fd2c6; --brand-ink: #04211e; --brand-soft: #12393a; --pulse: #3fd38c;
  --side: #08152f; --side-2: #10254d; --side-ink: #f1f5fb; --side-ink-2: #9db0d3;
  --ok: #5fd394; --ok-soft: #10301f; --warn: #f2b65a; --warn-soft: #36270d; --bad: #ff8f84; --bad-soft: #3c1714;
  --info: #86b9f2; --info-soft: #13273e; --tarja-vermelha: #ff7a73; --tarja-preta: #e5edf2;
  --overlay: rgba(0, 0, 0, 0.62); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

/* Alto contraste (RNF07): preto sobre branco, contornos fortes, foco amarelo. Vale nos dois temas. */
:root[data-contraste="alto"] {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #ffffff; --line: #000000; --line-strong: #000000;
  --ink: #000000; --ink-2: #000000; --ink-3: #1a1a1a;
  --brand: #003f3b; --brand-hover: #002a27; --brand-ink: #ffffff; --brand-soft: #ffffff; --pulse: #003f3b;
  --side: #000000; --side-2: #222222; --side-ink: #ffffff; --side-ink-2: #ffffff;
  --ok: #004d1f; --ok-soft: #ffffff; --warn: #5c3400; --warn-soft: #ffffff; --bad: #8a0000; --bad-soft: #ffffff;
  --info: #002f6c; --info-soft: #ffffff; --tarja-vermelha: #8a0000; --tarja-preta: #000000;
  --shadow: none; --focus: #ffd400; --tag-bg: #ffd400; --tag-ink: #000000;
  color-scheme: light;
}
:root[data-contraste="alto"] .pill,
:root[data-contraste="alto"] .card,
:root[data-contraste="alto"] .btn { border-width: 2px; border-color: currentColor; }
:root[data-contraste="alto"] .fluxo-barra { outline: 1.5px solid #000000; }
:root[data-contraste="alto"] .receituario { border: 2px solid #000000; }

:root[data-fonte="maior"] { font-size: 112.5%; }
:root[data-fonte="muito-maior"] { font-size: 125%; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: var(--t-2xl); }
h2 { font-size: var(--t-xl); }
h3 { font-size: var(--t-lg); }
h4 { font-size: var(--t-md); }
p { margin: 0; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-family: inherit; }
.muted { color: var(--ink-2); }
.subtle { color: var(--ink-3); font-size: var(--t-sm); }
.eyebrow { font-family: var(--f-body); font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ── Faixa do protótipo ── */
.demo-bar {
  background: var(--side);
  color: var(--side-ink);
  font-size: var(--t-sm);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  border-bottom: 1px solid var(--side-2);
}
.demo-bar strong { font-family: var(--f-display); font-weight: 600; }
.demo-bar .demo-tag { background: var(--tag-bg); color: var(--tag-ink); border-radius: 999px; padding: 1px 9px; font-weight: 700; font-size: var(--t-xs); letter-spacing: .04em; text-transform: uppercase; }
.demo-bar .personas { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.demo-bar button {
  border: 1px solid var(--side-2); background: transparent; color: var(--side-ink); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: var(--t-sm);
}
.demo-bar button[aria-pressed="true"] { background: var(--side-ink); color: var(--side); border-color: var(--side-ink); font-weight: 700; }
.demo-bar button:hover { border-color: var(--side-ink-2); }
@media (max-width: 640px) {
  .demo-bar { flex-wrap: nowrap; }
  .demo-bar .demo-texto { display: none; }
  .demo-bar .personas { flex-wrap: nowrap; overflow-x: auto; margin-left: 0; scrollbar-width: none; }
  .demo-bar button { white-space: nowrap; }
}

/* ── Shell ── */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--side); color: var(--side-ink);
  display: flex; flex-direction: column; gap: 20px;
  padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.marca { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.marca img { width: 38px; height: auto; }
.marca .nome { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1; }
.marca .nome small { display: block; font-family: var(--f-body); font-weight: 400; font-size: var(--t-xs); color: var(--side-ink-2); margin-top: 3px; letter-spacing: .02em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a, .nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  color: var(--side-ink-2); text-decoration: none; border: 0; background: none; cursor: pointer;
  padding: 9px 10px; border-radius: 8px; font-size: var(--t-md);
}
.nav a:hover, .nav button:hover { background: var(--side-2); color: var(--side-ink); }
.nav [aria-current="page"] { background: var(--side-2); color: var(--side-ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--pulse); }
.nav .badge { margin-left: auto; background: var(--tag-bg); color: var(--tag-ink); font-size: var(--t-xs); font-weight: 700; border-radius: 999px; padding: 0 7px; }
.nav svg { width: 18px; height: 18px; flex: none; }
.side .quem { margin-top: auto; border-top: 1px solid var(--side-2); padding: 14px 8px 0; font-size: var(--t-sm); color: var(--side-ink-2); }
.side .quem strong { color: var(--side-ink); display: block; font-size: var(--t-md); }
.side .quem button { margin-top: 10px; background: none; border: 1px solid var(--side-2); color: var(--side-ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topo {
  display: flex; align-items: center; gap: 12px;
  padding-block: 14px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
}
.topo .titulo { font-family: var(--f-display); font-weight: 600; font-size: var(--t-lg); }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.conteudo {
  padding-block: 24px 48px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  max-width: 1240px; width: 100%;
}
.nav-mobile { display: none; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .nav-mobile {
    display: flex; gap: 6px; overflow-x: auto; background: var(--side);
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    scrollbar-width: none;
  }
  .nav-mobile a, .nav-mobile button {
    flex: none; color: var(--side-ink-2); background: none; border: 1px solid var(--side-2); border-radius: 999px; padding: 6px 13px; text-decoration: none; cursor: pointer; font-size: var(--t-sm); white-space: nowrap;
  }
  .nav-mobile [aria-current="page"] { background: var(--side-ink); color: var(--side); border-color: var(--side-ink); font-weight: 700; }
  .topo, .conteudo { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topo { top: 0; position: static; }
  h1 { font-size: 1.6rem; }
}

/* ── Botões e campos ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: var(--t-md); text-decoration: none; white-space: nowrap;
  transition: background-color .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primario { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-primario:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--brand-ink); }
.btn-perigo { background: var(--surface); border-color: var(--bad); color: var(--bad); }
.btn-perigo:hover:not(:disabled) { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn-sm { padding: 5px 11px; font-size: var(--t-sm); }
.btn-link { border: 0; background: none; padding: 0; color: var(--brand); font-weight: 700; cursor: pointer; }
.btn svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 640px) { .btn { white-space: normal; text-align: center; } }

.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo label, .rotulo { font-weight: 700; font-size: var(--t-sm); color: var(--ink-2); }
.campo .ajuda { font-size: var(--t-xs); color: var(--ink-3); }
.campo .erro { font-size: var(--t-sm); color: var(--bad); }
.input, select.input, textarea.input {
  width: 100%; min-width: 0; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
.input:focus { border-color: var(--brand); outline: 3px solid var(--brand-soft); outline-offset: 0; }
textarea.input { min-height: 84px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: var(--t-sm); color: var(--ink-2); line-height: 1.45; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--brand); flex: none; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .inteiro { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }

/* ── Superfícies ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.secao-titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.grid-main-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 20px; align-items: start; }
.grid-lista-detalhe { display: grid; grid-template-columns: minmax(240px, 330px) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-detalhe-lista { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .grid-main-side { grid-template-columns: minmax(0, 1fr); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .grid-lista-detalhe, .grid-detalhe-lista { grid-template-columns: minmax(0, 1fr); } .grid-detalhe-lista > :last-child { order: -1; } }
@media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.cabecalho-pagina { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.cabecalho-pagina p { color: var(--ink-2); margin-top: 6px; max-width: 64ch; }

/* ── Status ── */
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: var(--t-sm); font-weight: 700;
  border: 1px solid transparent; white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill-neutro { background: var(--surface-2); color: var(--ink-2); }
.pill-espera { background: var(--warn-soft); color: var(--warn); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-marca { background: var(--brand-soft); color: var(--brand); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-ruim { background: var(--bad-soft); color: var(--bad); }
.tarja { font-size: var(--t-xs); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; border: 1.5px solid; }
.tarja-Vermelha { color: var(--tarja-vermelha); }
.tarja-Preta { color: var(--tarja-preta); }
.tarja-Livre { color: var(--ink-3); }

/* ── Tabelas ── */
.tabela-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tabela { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
.tabela th { text-align: left; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tabela td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela td.n, .tabela th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tabela tr.clicavel { cursor: pointer; }
.tabela tr.clicavel:hover td { background: var(--surface-2); }
.tabela tr[aria-selected="true"] td { background: var(--brand-soft); }
.tabela .sub td { background: var(--surface-2); padding-top: 4px; }

/* ── Linha do tempo do pedido (RN13: status honesto) ── */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.timeline li { position: relative; padding-top: 26px; text-align: left; font-size: var(--t-sm); color: var(--ink-3); min-width: 0; }
.timeline li::before { content: ""; position: absolute; top: 6px; left: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); z-index: 1; }
.timeline li::after { content: ""; position: absolute; top: 12px; left: 14px; right: 0; height: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.feito { color: var(--ink-2); }
.timeline li.feito::before { background: var(--brand); border-color: var(--brand); }
.timeline li.feito::after { background: var(--brand); }
.timeline li.atual { color: var(--ink); font-weight: 700; }
.timeline li.atual::before { background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.timeline li .quando { display: block; font-weight: 400; color: var(--ink-3); font-size: var(--t-xs); font-family: var(--f-mono); }
.timeline li span.etapa { display: block; padding-right: 8px; }
@media (max-width: 640px) {
  .timeline { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .timeline li { padding: 0 0 0 26px; }
  .timeline li::before { top: 2px; }
  .timeline li::after { left: 6px; top: 18px; bottom: -12px; right: auto; width: 2px; height: auto; }
}
.historico { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--line); padding-left: 14px; }
.historico li { font-size: var(--t-sm); color: var(--ink-2); }
.historico li strong { color: var(--ink); }
.historico .quando { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); display: block; }

.aviso { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r); padding: 12px 14px; font-size: var(--t-md); border: 1px solid; }
.aviso svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.aviso-info { background: var(--info-soft); border-color: transparent; color: var(--ink); }
.aviso-info svg { color: var(--info); }
.aviso-espera { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.aviso-espera svg { color: var(--warn); }
.aviso-ruim { background: var(--bad-soft); border-color: transparent; color: var(--ink); }
.aviso-ruim svg { color: var(--bad); }
.aviso-ok { background: var(--ok-soft); border-color: transparent; color: var(--ink); }
.aviso-ok svg { color: var(--ok); }

/* ── Organizador de horários (a Box do dia) ── */
.organizador { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.compartimento { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 12px; background: var(--surface); min-width: 0; }
.compartimento .hora { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 600; color: var(--brand); }
.compartimento .periodo { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 700; }
.compartimento ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); }
.compartimento li .dose { color: var(--ink-3); white-space: nowrap; }
.compartimento li::before { content: "●"; color: var(--pulse); margin-right: 6px; font-size: .7em; vertical-align: 2px; }

/* ── KPIs do painel ── */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi .valor { font-family: var(--f-display); font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .valor small { font-size: var(--t-md); color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.kpi .rotulo-kpi { font-size: var(--t-sm); color: var(--ink-2); font-weight: 700; }
.kpi .meta { font-size: var(--t-xs); color: var(--ink-3); }
.kpi.alerta { border-color: var(--warn); }
.kpi.alerta::before, .kpi.critico::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--warn); }
.kpi.critico { border-color: var(--bad); }
.kpi.critico::before { background: var(--bad); }

/* Fluxo da operação: barra proporcional por etapa */
.fluxo { display: flex; flex-direction: column; gap: 10px; }
.fluxo-linha { display: grid; grid-template-columns: 170px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: var(--t-sm); }
.fluxo-barra { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.fluxo-barra span { display: block; height: 100%; border-radius: 999px; background: var(--brand); min-width: 4px; }
.fluxo-linha .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .fluxo-linha { grid-template-columns: 120px minmax(0, 1fr) 30px; } }

.alertas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alertas li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; font-size: var(--t-sm); padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.alertas li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--warn); }
.alertas li.alta::before { background: var(--bad); }
.alertas strong { display: block; color: var(--ink); }

/* ── Assistente da Box ── */
.passos { list-style: none; display: flex; gap: 8px; margin: 0 0 22px; padding: 0; flex-wrap: wrap; counter-reset: passo; }
.passos li { counter-increment: passo; display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--ink-3); font-weight: 700; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.passos li::before { content: counter(passo); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-family: var(--f-mono); }
.passos li[aria-current="step"] { color: var(--ink); border-color: var(--brand); }
.passos li[aria-current="step"]::before { background: var(--brand); color: var(--brand-ink); }
.passos li.feito::before { content: "✓"; background: var(--brand-soft); color: var(--brand); }

.catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.med {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.med:hover { border-color: var(--brand); }
.med[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
.med .nome { font-family: var(--f-display); font-weight: 600; font-size: var(--t-md); }
.med .principio { font-size: var(--t-sm); color: var(--ink-2); }
.med .rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; font-size: var(--t-xs); color: var(--ink-3); }
.horarios { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-family: var(--f-mono); font-size: var(--t-sm);
}
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem; font-weight: 700; }
.stepper output { min-width: 44px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.box-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.box-lista li { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.box-lista li:last-child { border-bottom: 0; padding-bottom: 0; }
.ok-txt { color: var(--ok); font-weight: 700; }
.ruim-txt { color: var(--bad); font-weight: 700; }

/* ── Receituário (pré-visualização da receita) ── */
.receituario {
  background: #fffdf7; color: #1d2733; border: 1px solid #e3dccb; border-radius: 6px; padding: 22px 24px; font-family: var(--f-body); position: relative; overflow: hidden;
}
.receituario .cab { display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid #1d2733; padding-bottom: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.receituario .cab strong { font-family: var(--f-display); font-size: 1.05rem; }
.receituario .cab span { font-family: var(--f-mono); font-size: var(--t-xs); }
.receituario ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: var(--t-md); line-height: 1.5; }
.receituario .uso { margin-top: 12px; display: inline-block; border: 1.5px solid #1d2733; border-radius: 4px; padding: 1px 8px; font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.receituario .assinatura { margin-top: 18px; text-align: right; font-size: var(--t-sm); font-style: italic; }
.receituario .assinatura::before { content: ""; display: block; width: 180px; margin-left: auto; border-top: 1px solid #1d2733; margin-bottom: 4px; }
.arquivo-preview { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 18px; display: flex; gap: 12px; align-items: center; background: var(--surface-2); }
.arquivo-preview img { max-width: 100%; max-height: 360px; border-radius: 6px; }

/* ── Etiquetas dos sachês (separação) ── */
.etiquetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.etiqueta { border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px 12px; background: var(--surface); font-size: var(--t-sm); display: flex; flex-direction: column; gap: 3px; }
.etiqueta .topo-et { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px dashed var(--line-strong); padding-bottom: 4px; margin-bottom: 4px; }
.etiqueta .hora { font-family: var(--f-mono); font-weight: 600; font-size: 1.1rem; }
.etiqueta .lote { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); }

/* ── Entregador (mobile-first) ── */
.entregas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.entrega { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.entrega .endereco { font-size: var(--t-lg); font-family: var(--f-display); font-weight: 500; line-height: 1.3; }
.entrega .btn { width: 100%; padding: 13px 16px; font-size: var(--t-lg); }
.abas { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.abas button { border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 700; color: var(--ink-3); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.abas .cont { font-family: var(--f-mono); font-weight: 500; color: var(--ink-3); margin-left: 4px; }

/* ── Vazio, modal e avisos flutuantes ── */
.vazio { text-align: center; padding: 34px 18px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vazio svg { width: 40px; height: 40px; color: var(--ink-3); }
.modal-fundo { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal.largo { width: min(820px, 100%); }
.modal header { padding: 18px 20px 0; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal .corpo { padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal footer { padding: 0 20px 18px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.fechar { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 1.4rem; line-height: 1; padding: 2px 6px; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 11px 14px; font-size: var(--t-md); box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; }
.toast.ruim { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
pre.json { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--f-mono); font-size: var(--t-xs); max-height: 340px; overflow: auto; white-space: pre; margin: 0; }

/* ── Acesso público ── */
.acesso { min-height: calc(100dvh - 46px); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.acesso .lado-marca {
  background: var(--side); color: var(--side-ink); padding: 48px max(32px, env(safe-area-inset-left, 0px)) 40px; display: flex; flex-direction: column; gap: 28px; justify-content: space-between;
}
.acesso .lado-marca h1 { font-size: clamp(1.9rem, 3.2vw, 2.7rem); line-height: 1.12; max-width: 18ch; }
.acesso .lado-marca h1 em { font-style: normal; color: var(--pulse); }
.acesso .lado-marca p { color: var(--side-ink-2); max-width: 46ch; }
.acesso .pulso { width: 100%; max-width: 420px; height: 46px; color: var(--pulse); }
.acesso .lado-form { padding: 48px max(24px, env(safe-area-inset-right, 0px)) 40px max(24px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: center; gap: 22px; max-width: 560px; width: 100%; margin: 0 auto; }
.personas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.persona { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.persona:hover { border-color: var(--brand); }
.persona strong { font-family: var(--f-display); font-weight: 600; }
.persona span { font-size: var(--t-xs); color: var(--ink-3); }
.persona .perfil { font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
@media (max-width: 860px) {
  .acesso { grid-template-columns: minmax(0, 1fr); }
  .acesso .lado-marca { padding: 28px max(16px, env(safe-area-inset-left, 0px)) 24px; gap: 14px; }
  .acesso .lado-form { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .acesso .so-desktop { display: none; }
}
@media (max-width: 420px) { .personas { grid-template-columns: minmax(0, 1fr); } }

/* ── Menu de acessibilidade ── */
.a11y { position: relative; }
.a11y-painel { position: absolute; right: 0; top: calc(100% + 8px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; width: 260px; z-index: 20; display: flex; flex-direction: column; gap: 12px; }
.segmentado { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.segmentado button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer; font-weight: 700; }
.segmentado button + button { border-left: 1px solid var(--line-strong); }
.segmentado button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
